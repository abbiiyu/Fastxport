<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/struk.css">
    <title>Invoice Pembelian</title>
</head>
<body>
    <div class="invoice-container">
        <div class="header">
            <div class="header-content">
                <h1>Invoice Pembelian</h1>
                <img src="../logo.png" alt="Logo" class="logo">
            </div>
            <p class="date">Tanggal Pembelian: <span id="tanggal-pembelian"></span></p>
        </div>
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama Produk</th>
                    <th>Qty</th>
                    <th>Harga Satuan</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Sawi</td>
                    <td>2</td>
                    <td>Rp500.000</td>
                    <td>Rp1.000.000</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Bayam</td>
                    <td>3</td>
                    <td>Rp300.000</td>
                    <td>Rp900.000</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Kangkung</td>
                    <td>1</td>
                    <td>Rp200.000</td>
                    <td>Rp200.000</td>
                </tr>
            </tbody>
        </table>
        <div class="summary">
            <p><strong>Total:</strong> Rp2.100.000</p>
        </div>
        <div class="footer">
            <p>Terima Kasih atas Pembelian Anda!</p>
        </div>

        <button>Done</button>
    </div>

    <script>
        // Mendapatkan tanggal hari ini
        const tanggalPembelian = new Date().toLocaleDateString('id-ID', {
            day: '2-digit',
            month: 'long',
            year: 'numeric'
        });
        document.getElementById('tanggal-pembelian').textContent = tanggalPembelian;
    </script>
</body>
</html>
