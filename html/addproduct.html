<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AddProduct</title>
    <link rel="stylesheet" href="../css/addproduct.css">
</head>
<body>
    <div class="Add-Product">
        <h1>Add Product</h1>
        <form>
            <div class="form-row">
                <label for="productName">Product Name</label>
                <input type="text" id="productName" placeholder="Name your product">
            </div>

            <div class="form-row">
                <label for="description">Description</label>
                <textarea id="description" placeholder="contains information about weight, quality, etc"></textarea>
            </div>

            <div class="form-row">
                <label for="media">Media</label>
                <div class="media-upload">
                    <input type="file" id="media" multiple>
                    <span class="icon-plus">+</span>
                    <span class="upload-text">Add file or drag and drop files here</span>
                    <div id="file-names" class="file-names"></div> <!-- Tempat untuk menampilkan nama file -->
                </div>
            </div>
            

            <div class="form-row">
                <label for="price">Price</label>
                <input type="number" id="price" placeholder="your price">
            </div>

            <div class="form-row">
                <label for="stock">Stock</label>
                <input type="number" id="stock" placeholder="Stock...">
            </div>

            <div class="form-row">
                <label for="minBuy">Minimum Buy</label>
                <input type="number" id="minBuy" placeholder="0">
            </div>

            <div class="form-row">
                <label for="category">Category</label>
                <select id="category">
                    <option value="vegetable">Vegetable</option>
                    <option value="fruit">Fruit</option>
                    <option value="beans">Beans</option>
                </select>
            </div>

            <div class="button-container">
                <button class="add-button"><a href="#">Add</a></button>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('media');
        const fileNamesContainer = document.getElementById('file-names');
    
        fileInput.addEventListener('change', function () {
            // Kosongkan kontainer nama file sebelumnya
            fileNamesContainer.innerHTML = '';
    
            // Ambil file yang dipilih
            const files = fileInput.files;
    
            // Tampilkan nama file di kontainer
            if (files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const fileName = document.createElement('div');
                    fileName.textContent = files[i].name;
                    fileNamesContainer.appendChild(fileName);
                }
            }
        });
    </script>
    
</body>
</html>
